plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nandambiometrics'
version = '1.0.0'

android {
  namespace "expo.modules.nandambiometrics"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // BiometricPrompt with a CryptoObject (strong biometrics only).
  implementation "androidx.biometric:biometric:1.1.0"
}
