<!doctype html>
<html lang="en-IN" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Design kit · website mock-up</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/logo-96.png">
  <link rel="stylesheet" href="assets/ecom.css">
  <link rel="stylesheet" href="assets/mock.css">
  <script src="assets/data.js"></script>
  <script src="assets/opts.js"></script>
</head>
<body>
  <div class="mock-strip" role="note"><span class="mock-tag">Mock-up</span> Design kit · <a href="index.html">Start page</a> · <a href="site.html#/">The website</a> · switch the look in Design options</div>
  <main class="kit" id="kit"></main>
  <script>window.W10_KIT = true;</script>
  <script src="assets/icons.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var HC = window.HC, NH = window.NH, icon = HC.icon, rs = HC.rs;
      var ps = NH.products;
      var one = ps.filter(function (p) { return p.available === 1; });
      var set = ps.filter(function (p) { return p.available > 1; })[0];
      var sw = [['--bg', 'Page'], ['--surface-2', 'Soft panel'], ['--surface-3', 'Placeholder'], ['--line-2', 'Lines'], ['--ink', 'Text'], ['--ink-2', 'Text, softer'], ['--muted', 'Muted'], ['--accent', 'Accent'], ['--accent-soft', 'Accent, soft'], ['--gold', 'Gold'], ['--ok', 'Success'], ['--warn', 'Warning'], ['--bad', 'Error'], ['--info', 'Information']];
      var icons = ['search', 'bag', 'user', 'menu', 'x', 'right', 'down', 'plus', 'minus', 'check', 'filter', 'sliders', 'truck', 'shield', 'thread', 'whatsapp', 'lock', 'pin', 'box', 'home', 'zoom', 'share', 'trash', 'copy', 'download', 'refresh', 'upi', 'card', 'bank', 'info', 'alert', 'alertc', 'g3', 'g4', 'spark', 'grid'];
      var tilePick = function () { var v = (window.W10Opts && window.W10Opts.get('tile')) || 'a'; return '<div class="row-wrap" role="group" aria-label="Collection photo">' + [['a', 'A Name on the photo'], ['b', 'B Name under the photo']].map(function (c) { return '<button type="button" class="chip" data-tile-pick="' + c[0] + '" aria-pressed="' + (v === c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div>'; };
      var cats = HC.CATS; var soon = cats.filter(function (c) { return c.soon; })[0]; var lehenga = cats.filter(function (c) { return c.slug === 'pattu-lehanga-sets'; })[0] || cats[0];
      var latest = NH.collections.slice().sort(function (a, b) { return b.newest.localeCompare(a.newest); }).slice(0, 6);
      function draw() {
        document.getElementById('kit').innerHTML =
          '<section><span class="eyebrow">Design kit · mock-up</span><h1 class="display" style="font-size:clamp(2rem,4vw,3rem)">The parts of the shop</h1><p class="lead">Colours, type and parts used on every screen, in the look picked in Design options (light and dark from one set of colours).</p></section>' +
          '<section><h2>Colours</h2><div class="swatches">' + sw.map(function (s) { return '<div class="swatch"><i style="background:var(' + s[0] + ')"></i><span>' + s[1] + ' <code>' + s[0] + '</code></span></div>'; }).join('') + '</div></section>' +
          '<section><h2>Type</h2><div class="type-scale"><p class="display" style="font-size:2.2rem">Mangalagiri pattu sarees</p><h3 style="font-size:1.3rem">Section title</h3><p>Body text: free delivery anywhere in India, usually in 3 to 7 days.</p><p class="muted small">Small, muted: Code NH-MHPS-1862</p><p class="eyebrow">Eyebrow · Embroidery</p><p><span class="price" style="font-size:1.6rem">' + rs(2800) + '</span></p></div></section>' +
          '<section><h2>Buttons</h2><div class="row"><button class="btn btn-primary">' + icon('bag', 'ico-sm') + 'Add to bag</button><button class="btn btn-dark">Buy now</button><button class="btn">View bag</button><a class="btn btn-wa" href="#">' + icon('whatsapp', 'ico-sm') + 'Order on WhatsApp</a><button class="btn btn-primary btn-lg">' + icon('lock', 'ico-sm') + 'Checkout</button><button class="btn btn-sm">Small</button><button class="btn" disabled>Disabled</button><button class="btn-link">A link button</button><button class="btn-icon" aria-label="Search">' + icon('search') + '</button></div></section>' +
          '<section><h2>Fields</h2><div class="form-grid" style="max-width:720px"><div class="field"><label class="label" for="k1">Full name</label><input id="k1" class="input" value="Priya Sharma"></div><div class="field"><label class="label" for="k2">State</label><select id="k2" class="select"><option>Telangana</option></select></div><div class="field"><label class="label" for="k3">Pincode</label><input id="k3" class="input is-bad" value="5000"><span class="err">The pincode needs 6 digits.</span></div><div class="field"><label class="label" for="k4">Mobile number</label><div class="mob-input"><span>+91</span><input id="k4" value="98765 43210"></div></div><div class="field full"><span class="label">The SMS code</span><div class="otp" style="max-width:380px">' + '123456'.split('').map(function (d, i) { return '<input aria-label="Digit ' + (i + 1) + '" value="' + d + '">'; }).join('') + '</div></div></div></section>' +
          '<section><h2>Chips, filters and badges</h2><div class="row"><span class="chip">Embroidery <small>387</small></span><span class="chip on">Pattu sarees</span><button class="chip">Craft ' + icon('down') + '</button></div><div class="row"><span class="badge new">New</span><span class="badge set">Set of 2</span><span class="badge out">Sold out</span><span class="badge info">Paid · being packed</span><span class="badge warn">Shipped</span><span class="badge ok">Delivered</span></div><div style="max-width:280px"><label class="fopt"><input type="checkbox" checked><span>Embroidery</span><small>48</small></label><label class="fopt"><input type="checkbox"><span>Applique</span><small>18</small></label><label class="fopt zero"><input type="checkbox" disabled><span>Checks</span><small>0</small></label></div></section>' +
          '<section><h2>Messages</h2><div style="display:grid;gap:.6rem;max-width:720px"><div class="alert ok">' + icon('check') + '<div><b>Added to your bag</b>50/50 Digital Print Sarees</div></div><div class="alert info">' + icon('truck') + '<div><b>DTDC tracking number: D84512039</b>Shipped on 24 Oct</div></div><div class="alert warn">' + icon('alert') + '<div><b>This saree has sold</b>We often have one like it.</div></div><div class="alert bad">' + icon('alertc') + '<div><b>The payment didn\'t go through</b>No money was taken.</div></div></div><button type="button" class="btn" data-toast>Show a toast</button></section>' +
          '<section><h2>The saree card (A, as picked)</h2><div class="grid" style="--cols:4">' + [one[0], set, one[1], one[2]].map(HC.card).join('') + '</div><h3 style="font-size:1rem;margin-top:1rem">Loading</h3><div class="grid" style="--cols:4">' + [0, 1, 2, 3].map(HC.skelCard).join('') + '</div></section>' +
          '<section><h2>A category on the home page (round photos)</h2><div class="cat-strip" style="margin:0;padding-left:0">' + cats.map(function (c) { return '<a class="cs cat' + (c.soon ? ' soon' : '') + '" href="#"><span class="ph"><img src="' + c.image + '" alt=""></span>' + c.short + '<small>' + (c.soon ? 'Coming soon' : c.count) + '</small></a>'; }).join('') + '</div></section>' +
          '<section><h2>A collection\'s photo</h2>' + tilePick() + '<div class="ccols">' + latest.slice(0, 4).map(HC.colTile).join('') + '</div><h3 style="font-size:1rem;margin-top:1rem">Latest collections (smaller, in a sliding row) and loading</h3><div class="latest"><div class="rail">' + latest.map(HC.colTile).join('') + '</div><div class="rail" style="margin-top:10px">' + [0, 1, 2, 3, 4, 5].map(HC.skelTile).join('') + '</div></div></section>' +
          '<section><h2>A category\'s banner: slim (A) and big (B)</h2><div class="cbanner"><img src="' + lehenga.banner + '" alt=""><div class="wrap" style="padding:0 20px"><div class="in"><span class="eyebrow">' + lehenga.count + ' pieces · ' + lehenga.collections + ' collections</span><h3 style="font-family:var(--title-font);font-weight:var(--title-weight);font-size:2rem">' + lehenga.name + '</h3><p>' + lehenga.description + '</p></div></div></div><div class="cbanner big" style="margin-top:10px"><img src="' + lehenga.banner + '" alt=""><div class="wrap" style="padding:0 20px"><div class="in"><span class="eyebrow">Big</span><h3 style="font-family:var(--title-font);font-weight:var(--title-weight);font-size:2.4rem">' + lehenga.name + '</h3><p>' + lehenga.description + '</p></div></div></div></section>' +
          (soon ? '<section><h2>A category without sarees yet</h2><div class="empty"><span class="ring">' + icon('spark') + '</span><h3>' + soon.short + ': new pieces coming soon</h3><p>We\'re adding them to the website.</p><div class="row-wrap" style="justify-content:center">' + soon.upcoming.map(function (x) { return '<span class="chip">' + x + '</span>'; }).join('') + '</div></div></section>' : '') +
          '<section><h2>A collection page\'s toolbar</h2><div class="ctool"><div class="l"><button type="button" class="chip" aria-pressed="false">Sets only</button><span class="count">46 sarees</span></div><div class="r"><select class="select" aria-label="Sort by"><option>Newest first</option></select><div class="density" role="group" aria-label="Grid size"><button type="button" aria-pressed="false" aria-label="Bigger photos">' + icon('g3') + '</button><button type="button" aria-pressed="true" aria-label="Smaller photos">' + icon('g4') + '</button></div></div></div><div class="more-wrap"><span class="muted small">You\'ve seen 24 of 46</span><span class="bar"><i style="width:52%"></i></span><button type="button" class="btn">Load more</button></div></section>' +
          '<section><h2>Order card and progress</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem"><div class="ocard"><div class="top"><div><b>Order NH25104471</b><small>22 Oct 2026 · 2 pieces</small></div><span class="badge warn">Shipped</span></div><div class="thumbs">' + [ps[5], ps[9]].map(function (p) { return '<img src="' + p.photos[0].src + '" alt="">'; }).join('') + '</div><div class="bot"><span class="price">' + rs(4000) + '</span><span class="muted small">View details ›</span></div></div>' +
          '<div class="panel"><ol class="timeline"><li class="done"><i>' + icon('check', 'ico-sm') + '</i><span><b>Paid</b><small>22 Oct</small></span></li><li class="done"><i>' + icon('box', 'ico-sm') + '</i><span><b>Packed</b><small>24 Oct</small></span></li><li class="now"><i>' + icon('truck', 'ico-sm') + '</i><span><b>Shipped</b><small>24 Oct · DTDC</small></span></li><li><i>' + icon('home', 'ico-sm') + '</i><span><b>Delivered</b><small>Usually 3 to 7 days</small></span></li></ol></div>' +
          '<div class="sumbox"><h2>Order summary</h2><div class="r"><span>Subtotal (3 pieces)</span><span>' + rs(8200) + '</span></div><div class="r"><span>Delivery</span><span class="free">Free</span></div><div class="r tot"><span>Total</span><span>' + rs(8200) + '</span></div><p class="note">Includes GST.</p></div></div></section>' +
          '<section><h2>Empty and error states</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem"><div class="empty"><span class="ring">' + icon('bag') + '</span><h3>Your bag is empty</h3><p>Add the sarees you like.</p></div><div class="empty"><span class="ring">' + icon('search') + '</span><h3>Nothing found for "banarasi"</h3><p>Try another word.</p></div><div class="empty"><span class="ring">' + icon('wifioff') + '</span><h3>We couldn\'t load the sarees</h3><p>Check your connection.</p></div></div></section>' +
          '<section><h2>Icons (the live website\'s)</h2><div class="icons">' + icons.map(function (i) { return '<div>' + icon(i) + i + '</div>'; }).join('') + '</div></section>';
      }
      draw();
      document.addEventListener('w10opts', draw);
      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-tile-pick]');
        if (b) { window.W10Opts.set('tile', b.getAttribute('data-tile-pick')); return; }
        if (e.target.closest('[data-toast]')) { var box = document.querySelector('.toasts') || document.body.appendChild(Object.assign(document.createElement('div'), { className: 'toasts' })); var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.innerHTML = icon('check') + '<span>Added to your bag</span><button type="button">View bag</button>'; box.appendChild(t); setTimeout(function () { t.remove(); }, 4000); }
        if (e.target.closest('#kit a[href^="#"], #kit [data-add]')) e.preventDefault();
      }, true);
    })();
  </script>
</body>
</html>
